# Exercises sourcing the entire `registries:` block from a Secret instead of
# templating it from config.registries (the supported way to configure
# s3-cache, whose access_key/secret_key must not appear in values.yaml).
auth:
  existingSecret: dependaproxy-auth
storage:
  existingSecret: dependaproxy-storage
config:
  registries: []
  registriesExistingSecret: dependaproxy-registries
  registriesKey: registries.yaml
