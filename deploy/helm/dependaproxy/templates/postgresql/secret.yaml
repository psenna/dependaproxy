# This Secret's postgres-password is generated ONCE and then preserved across
# `helm upgrade` via a lookup-and-reuse pattern (the same idiom well-known
# charts such as Bitnami's use, for the same reason: `helm upgrade` must never
# rotate a live database's actual credentials out from under it).
#
# CAVEATS:
#   (a) `lookup` returns nil during `helm template`, `helm install --dry-run`,
#       and `helm diff` -- none of those commands can see cluster state, so
#       each such run generates a FRESH random password. Never diff-compare
#       this Secret's rendered content between runs; it is expected to change
#       every time under those commands even though nothing changed in the
#       cluster.
#   (b) `helm rollback` to a revision from before this Secret was first
#       generated restores THAT revision's manifest, which may carry a stale
#       password -- while the actual PostgreSQL data volume keeps whatever the
#       CURRENT password is. If that happens, recover by either:
#         - `kubectl exec` into the postgresql pod and run
#           `ALTER USER <user> PASSWORD '<current-password>';` to reconcile, or
#         - `kubectl delete pvc <postgresql-fullname>-data-...` plus a fresh
#           install, if the existing data can be discarded.
{{ if .Values.postgresql.enabled -}}
{{- $name := include "dependaproxy.postgresql.fullname" . -}}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := "" -}}
{{- if and $prev $prev.data (hasKey $prev.data "postgres-password") -}}
{{- $pw = index $prev.data "postgres-password" | b64dec -}}
{{- else -}}
{{- $pw = randAlphaNum 32 -}}
{{- end -}}
{{- $user := .Values.postgresql.auth.username -}}
{{- $db := .Values.postgresql.auth.database -}}
{{- $host := printf "%s.%s.svc.cluster.local" $name .Release.Namespace -}}
{{- $sslmode := .Values.postgresql.auth.sslmode -}}
{{- $dsn := printf "postgres://%s:%s@%s:5432/%s?sslmode=%s" $user (urlquery $pw) $host $db $sslmode -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dependaproxy.postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pw | quote }}
  storage.yaml: |
    storage:
      type: postgres
      dsn: "{{ $dsn }}"
{{- end }}
