# kubectl apply -f registries-secret.yaml
# Then set:
#   config.registries: []
#   config.registriesExistingSecret: dependaproxy-registries
#   config.registriesKey: registries.yaml   # only if you use a different key name
#
# config.registriesExistingSecret and config.registries are mutually
# exclusive -- the chart refuses to render if both are set (two top-level
# `registries:` keys in one assembled config.yaml is a duplicate-mapping-key
# parse error and dependaproxy would crash-loop).
#
# This is the supported way to configure the s3-cache retrieval middleware:
# its access_key/secret_key live inside registries[].retrieval[].params, so
# putting the whole `registries:` block in a Secret is the only way to keep
# those credentials out of values.yaml (and out of your values files /
# CI logs / helm history).
apiVersion: v1
kind: Secret
metadata:
  name: dependaproxy-registries
type: Opaque
stringData:
  registries.yaml: |
    registries:
      - type: npm
        prefix: /npm
        upstream: https://registry.npmjs.org
        validation:
          - type: deny-list-check
          - type: min-publication-age
            params:
              min_days: 7
          - type: cve-check
            params:
              mode: deny
          - type: malware-scan
            params:
              mode: warn
          - type: guarddog-scan
            params:
              mode: deny
              on_error: fail_open
              timeout: 60s
        retrieval:
          - type: cve-check-retrieval
            params:
              mode: deny
              on_error: fail_open
              cache_ttl: 1h
          - type: s3-cache
            params:
              endpoint: s3.us-east-1.amazonaws.com
              bucket: my-dependaproxy-cache
              region: us-east-1
              access_key: "CHANGE-ME-access-key"
              secret_key: "CHANGE-ME-secret-key"
              use_ssl: true
              base_path: npm
          - type: upstream-registry
      - type: pypi
        prefix: /pypi
        upstream: https://pypi.org/simple
        validation:
          - type: deny-list-check
          - type: min-publication-age
            params:
              min_days: 7
          - type: cve-check
            params:
              mode: deny
          - type: malware-scan
            params:
              mode: warn
          - type: guarddog-scan
            params:
              mode: deny
              on_error: fail_open
              timeout: 60s
        retrieval:
          - type: cve-check-retrieval
            params:
              mode: deny
              on_error: fail_open
              cache_ttl: 1h
          - type: s3-cache
            params:
              endpoint: s3.us-east-1.amazonaws.com
              bucket: my-dependaproxy-cache
              region: us-east-1
              access_key: "CHANGE-ME-access-key"
              secret_key: "CHANGE-ME-secret-key"
              use_ssl: true
              base_path: pypi
          - type: upstream-registry
