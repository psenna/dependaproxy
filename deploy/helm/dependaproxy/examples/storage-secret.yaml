# kubectl apply -f storage-secret.yaml
# Then set: storage.existingSecret: dependaproxy-storage
#
# Only used on the external/managed-PostgreSQL path (postgresql.enabled:
# false, the production-recommended default). When postgresql.enabled: true
# instead, the chart bundles a single-instance DEV/DEMO-ONLY PostgreSQL and
# auto-generates its own equivalent Secret (with the same `storage.yaml` key
# shape) -- do not create this Secret yourself in that case.
apiVersion: v1
kind: Secret
metadata:
  name: dependaproxy-storage
type: Opaque
stringData:
  storage.yaml: |
    storage:
      type: postgres
      dsn: "postgres://dependaproxy:CHANGE-ME@your-postgres-host:5432/dependaproxy?sslmode=require"
