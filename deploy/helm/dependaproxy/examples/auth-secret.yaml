# kubectl apply -f auth-secret.yaml
# Then set: auth.existingSecret: dependaproxy-auth
#
# `token` and `admin_token` MUST differ -- dependaproxy enforces this
# (privilege separation between package-fetch clients and the admin API).
#
# An empty `token` disables package-fetch auth entirely. That is documented
# as a local-dev-only convenience -- never do this behind a public Ingress.
#
# `admin_token` can never be empty: internal/config's Validate() rejects an
# empty admin_token whenever storage is configured, and storage is always
# configured (storage.type must always be "postgres"), so there is no
# deployment where admin_token may be omitted.
apiVersion: v1
kind: Secret
metadata:
  name: dependaproxy-auth
type: Opaque
stringData:
  auth.yaml: |
    auth:
      token: "CHANGE-ME-package-fetch-token"
      admin_token: "CHANGE-ME-admin-token-MUST-DIFFER-FROM-token"
