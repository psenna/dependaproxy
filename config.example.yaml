# DependaProxy v2 multi-registry example configuration.
#
# One instance serves multiple registries, each under its own URL path prefix.
# Adding a registry = add an entry under `registries:` once its adapter is
# registered (npm ships now; pypi and maven adapters land in later issues).

server:
  addr: ":8080"

# Static bearer token shared across all registries. Clients send
# `Authorization: Bearer <token>`. Empty/omit to disable auth (local dev only).
auth:
  token: "change-me"

# Shared PostgreSQL backend (one pool; each adapter owns its table).
storage:
  type: postgres
  dsn: "postgres://dependaproxy:secret@postgres:5432/dependaproxy?sslmode=disable"

log:
  level: info   # debug | info | warn | error
  format: json  # json | text

registries:
  - type: npm
    prefix: /npm
    upstream: https://registry.npmjs.org
    validation:
      - type: min-publication-age
        params:
          min_days: 7
      # Reject (or warn about) packages with known vulnerabilities, checked
      # against OSV.dev at validation time. mode: deny (default, 403) | warn
      # (serve + log). on_error: fail_open (default) | fail_closed.
      - type: cve-check
        params:
          mode: deny
      # Static heuristics on the tarball: npm install scripts + suspicious
      # script contents; pypi setup.py/PKG-INFO patterns + wheel exec files.
      # mode: deny (default, 403) | warn (serve + log).
      - type: malware-scan
        params:
          mode: warn
    # cve-check-retrieval MUST be FIRST in the retrieval list (outermost) so it
    # runs on EVERY serve — trusted (cache hit) and untrusted — re-checking OSV
    # for a CVE published after the artifact was first validated. The validation
    # cve-check above still gates the initial trust decision on the first
    # untrusted fetch.
    retrieval:
      - type: cve-check-retrieval
        params:
          mode: deny
          on_error: fail_open
          cache_ttl: 1h
      - type: local-disk-cache
        params:
          path: /var/lib/dependaproxy/cache/npm
      - type: upstream-registry
    # Mutations are non-persistent view transforms re-applied on every serve
    # (trusted and untrusted). The stored sha256 remains the UPSTREAM hash;
    # the mutation rewrites the bytes served to the client AFTER verification.
    # Re-tarring on every serve adds CPU (follow-up: cache mutated bytes).
    # mutation:
    #   - type: strip-install-scripts   # npm only
    #     # Strips preinstall/install/postinstall from package.json scripts
    #     # (other scripts preserved). Best-effort: a tarball with no
    #     # package.json or an invalid archive is served unchanged.

  # The pypi adapter is registered; enable it to also serve Python packages:
  - type: pypi
    prefix: /pypi
    upstream: https://pypi.org/simple
    validation:
      - type: min-publication-age
        params:
          min_days: 7
      - type: cve-check
        params:
          mode: deny
      - type: malware-scan
        params:
          mode: warn
    # cve-check-retrieval MUST be FIRST in the retrieval list (outermost) so it
    # runs on EVERY serve — trusted (cache hit) and untrusted — re-checking OSV
    # for a CVE published after the artifact was first validated. The validation
    # cve-check above still gates the initial trust decision on the first
    # untrusted fetch.
    retrieval:
      - type: cve-check-retrieval
        params:
          mode: deny
          on_error: fail_open
          cache_ttl: 1h
      - type: local-disk-cache
        params:
          path: /var/lib/dependaproxy/cache/pypi
      - type: upstream-registry

  # The maven adapter is registered as a skeleton (returns 501); full Maven
  # Central routing/storage land in a future issue:
  # - type: maven
  #   prefix: /maven
  #   upstream: https://repo1.maven.org/maven2
  #   validation: []
  #   retrieval: []

# ---------------------------------------------------------------------------
# Projects (per-project configuration + SBOM)
# ---------------------------------------------------------------------------
# Projects are NOT defined in this static file — they are managed at runtime
# through the authenticated admin REST API at /admin (gated by the same
# `auth.token` above; a dedicated admin token is a future hardening). See
# README "Projects" for the full route list.
#
# A project lets a consuming codebase override the GLOBAL per-registry
# middleware config above by passing a project key in the URL:
#   default:        http://dependaproxy:8080/npm/<pkg>
#   project-scoped: http://dependaproxy:8080/npm/p/<key>/<pkg>
# (same for pypi: /pypi/p/<key>/simple/<pkg>/). No key, or an unknown key,
# falls back to the global config above — zero overhead on the default path.
#
# The admin API stores each project's config as YAML in the `projects.config`
# column. The shape mirrors the per-registry middleware lists above (minus the
# fixed type/prefix/upstream), keyed by registry type. Example (what a
# `POST /admin/projects` body with a JSON `registries` map becomes):
#
#   npm:
#     validation:
#       - type: cve-check
#         params:
#           mode: warn        # override the global `deny` for this project
#     # retrieval/mutation omitted -> reuse the global chains (per-chain fallback)
#   pypi:
#     validation:
#       - type: cve-check
#         params:
#           mode: warn
#
# Per-chain fallback: a chain (validation/retrieval/mutation) present in the
# project config is rebuilt; a chain omitted reuses the global one. After a
# PUT/DELETE the resolver cache for that key is dropped, so the next
# /npm/p/<key>/... request rebuilds from the updated config.
#
# Each project-scoped download is recorded in `project_dependencies` (an async,
# buffered flush) and exposed as an SBOM via
#   GET /admin/projects/<key>/dependencies?registry=&pkg=
#
# Create a project:
#   curl -X POST http://dependaproxy:8080/admin/projects \
#     -H "Authorization: Bearer $DEPENDAPROXY_TOKEN" -H 'Content-Type: application/json' \
#     -d '{"key":"acme","registries":{"npm":{"validation":[{"type":"cve-check","params":{"mode":"warn"}}]}}}'