# DependaProxy v2 multi-registry example configuration.
#
# One instance serves multiple registries, each under its own URL path prefix.
# Adding a registry = add an entry under `registries:` once its adapter is
# registered (npm ships now; pypi and maven adapters land in later issues).

server:
  addr: ":8080"

# Static bearer token shared across all registries. Clients send
# `Authorization: Bearer <token>`. Empty/omit to disable auth (local dev only).
auth:
  token: "change-me"

# Shared PostgreSQL backend (one pool; each adapter owns its table).
storage:
  type: postgres
  dsn: "postgres://dependaproxy:secret@postgres:5432/dependaproxy?sslmode=disable"

log:
  level: info   # debug | info | warn | error
  format: json  # json | text

registries:
  - type: npm
    prefix: /npm
    upstream: https://registry.npmjs.org
    validation:
      - type: min-publication-age
        params:
          min_days: 7
    retrieval:
      - type: local-disk-cache
        params:
          path: /var/lib/dependaproxy/cache/npm
      - type: upstream-registry

  # Uncomment once the pipy adapter is registered (issue #38+):
  # - type: pypi
  #   prefix: /pypi
  #   upstream: https://pypi.org/simple
  #   validation:
  #     - type: min-publication-age
  #       params:
  #         min_days: 7
  #   retrieval:
  #     - type: local-disk-cache
  #       params:
  #         path: /var/lib/dependaproxy/cache/pypi
  #     - type: upstream-registry

  # Uncomment once the maven adapter is registered (issue #42+):
  # - type: maven
  #   prefix: /maven
  #   upstream: https://repo1.maven.org/maven2
  #   validation: []
  #   retrieval: []