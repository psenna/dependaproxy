storage:
  type: postgres
  dsn: "postgres://u:p@host:5432/db?sslmode=disable"
registries:
  - type: npm
    prefix: /x
    upstream: https://registry.npmjs.org
    retrieval:
      - type: upstream-registry
  - type: pypi
    prefix: /x
    upstream: https://pypi.org/simple
    retrieval:
      - type: upstream-registry