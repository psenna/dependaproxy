server:
  addr: ":9090"
auth:
  token: "change-me"
storage:
  type: postgres
  dsn: "postgres://u:p@host:5432/db?sslmode=disable"
registry: npm
upstream: https://registry.npmjs.org
log:
  level: info
  format: json
validation:
  - type: min-publication-age
    params:
      min_days: 7
retrieval:
  - type: local-disk-cache
    params:
      path: /var/lib/dependaproxy/cache
  - type: upstream-registry
mutation: []