name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  # golangci-lint is installed via `go install` so it is built with the same
  # Go toolchain as the project (a prebuilt v2.0.x binary is built with go1.24
  # and refuses a go1.25 target).
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  build-test:
    name: lint + test + race + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: dependaproxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dependaproxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Storage/integration tests connect to localhost services.
      DP_TEST_PG_DSN: "postgres://postgres:secret@localhost:5432/dependaproxy?sslmode=disable"
      DP_TEST_MINIO_ENDPOINT: "localhost:9000"
      DP_TEST_MINIO_ACCESS_KEY: "dependaproxy"
      DP_TEST_MINIO_SECRET_KEY: "changeme"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt drift in:"
            echo "$fmt"
            exit 1
          fi

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint run ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Real S3-compatible backend for the s3-cache integration tests. Started as
      # a step (not a service container) because the minio/minio image's default
      # command prints usage and exits — GitHub Actions services can't pass
      # `server /data` as a command, so we start it here with the right args and
      # wait for it to be healthy before the tests run.
      - name: start minio (S3-cache integration tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dependaproxy -e MINIO_ROOT_PASSWORD=changeme \
            minio/minio server /data
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:9000/minio/health/live; then
              echo "minio ready"
              exit 0
            fi
            sleep 1
          done
          echo "minio did not become healthy:"; docker logs minio; exit 1

      - name: test (race + coverage)
        env:
          # The race detector links the race runtime via gcc (present on the
          # ubuntu runner), so it needs CGo even though the project itself is CGo-free.
          CGO_ENABLED: "1"
        run: go test -race -p 1 -coverprofile=cover.out ./...

      - name: coverage summary
        run: go tool cover -func=cover.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  web-test:
    name: web build + lint + unit + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: assert web/dist exists
        run: test -f dist/index.html && test -d dist/assets
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker-build:
    name: docker build (web-build stage + Go embed, amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: docker build (multi-arch)
        run: docker buildx build --platform linux/amd64,linux/arm64 -t dependaproxy:ci .
      - name: assert web-build stage produced dist
        run: |
          # --load: with the docker-container driver, buildx doesn't put the
          # image in the local daemon unless --load is given; docker run needs it.
          docker buildx build --platform linux/amd64 --target web-build -t dp-web:ci --load .
          docker run --rm --platform linux/amd64 dp-web:ci sh -c 'test -f /src/web/dist/index.html'